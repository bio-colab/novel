name: World Invariants & Integrity Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    name: Deterministic World Invariant Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Manuscript Baseline Sanctity (SHA-256)
        run: |
          echo "A173202BB1BF875B3EF371ACE387B107418E7292BA58CC79F751DE087FF607EC *00_BASELINE/novel_baseline.md" | sha256sum --check

      - name: Verify Clean Root Workspace (No Duplicate RTF)
        run: |
          test ! -f "رواية.rtf"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Automated Unit Tests Suite
        run: python -m unittest discover -s tests -v

      - name: Run Master Platform Orchestrator (All Phases & Linters)
        run: python 02_TOOLS/master_auditor.py --ci

      - name: Run World Invariants Core Auditor
        run: python 02_TOOLS/world_auditor.py

      - name: Run Epistemic State Tracker
        run: python 02_TOOLS/epistemic_tracker.py

      - name: Run Narrative Causality Graph Analyzer
        run: python 02_TOOLS/causality_graph.py

      - name: Run Discrete-Event Physical Profiler
        run: python 02_TOOLS/chrono_event_engine.py

      - name: Run Psychology & Behavioral Detector
        run: python 02_TOOLS/psychology_detector.py

      - name: Run Socio-Demography & Ideology Analyzer
        run: python 02_TOOLS/socio_demography_analyzer.py

      - name: Run Historical & Political Analyzer
        run: python 02_TOOLS/historical_political_analyzer.py

      - name: Run Meta-Auditor Legal & Reference Integrity Check
        run: python 02_TOOLS/meta_auditor.py

      - name: Run Grounding & Telemetry Calibration Auditor
        run: python 02_TOOLS/grounding_auditor.py

      - name: Run Moral Entropy & Existential Solidarity Monitor
        run: python 02_TOOLS/moral_entropy_monitor.py

      - name: Verify World Brain Graph Generation
        run: python 02_TOOLS/world_graph_builder.py

      - name: Run Chrono Simulation Engine & Digital Twin
        run: python 06_SIMULATION_ENGINE/simulation_runner.py

      - name: Upload Master Audit Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-audit-report
          path: 03_AUDIT_AND_ISSUES/MASTER_AUDIT_REPORT.json





