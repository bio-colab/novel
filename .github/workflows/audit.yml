name: World Invariants & Integrity Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    name: Deterministic World Invariant Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run World Invariants Auditor
        run: python 02_TOOLS/world_auditor.py

      - name: Verify World Brain Graph Generation
        run: python 02_TOOLS/world_graph_builder.py
