[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-engine"
version = "1.0.0"
description = "Deterministic Narrative World Operating System & Digital Twin Framework for Literature"
readme = "README.md"
authors = [
    { name = "bio-colab", email = "research@narrative-engine.org" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "narrative-engineering",
    "world-building",
    "digital-twin",
    "obsidian",
    "computational-humanities",
    "narrative-os",
    "causality-dag"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
world-engine = "world_engine.cli:main"
world_engine = "world_engine.cli:main"

[project.urls]
Homepage = "https://github.com/bio-colab/novel"
Documentation = "https://bio-colab.github.io/novel"
Repository = "https://github.com/bio-colab/novel.git"
Issues = "https://github.com/bio-colab/novel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["world_engine*"]
