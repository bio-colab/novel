      fragility_score: 0.88
    remediation_proposal:
      proposal_id: "PR-002-AMBUSH"
      patch: >
        تأسيس مبرر موضوعي حتمي: وميض كشافات لدورية حدودية بعيدة شوهدت على خط الهضبة،
        أو أن الهدف الحصري للكمين كان شخصاً محدداً (تصفية/استخلاص) وانتهت المهمة.

  - id: "WORLD-BUG-003"
    title: "الفجوة الزمنية واستهلاك الصقيع بين 01:00 و 04:30"
    type: "Thermodynamics_and_Biology"
    severity: "MEDIUM_HIGH"
    law_broken: "LAW-THERMO-01 & LAW-BIO-01"
    observed:
      description: >
        مرور 210 دقيقة في النص بأسطر قليلة وتأملات مجردة، بينما تظل الشخصيات على قيد الحياة
        وتحتفظ بقدرتها على التحدث بحرية والتصرف دون علامات الهذيان أو التيبس الطرفي الحاد.
      state_snapshot: "environment.temp drops from -4.0°C to -8.0°C with zero heat source"
    required:
      invariant: >
        التعرض لـ 3.5 ساعات في صاج مضلع غير معزول عند درجات بين -4°C و -8°C يفرض حتمياً دخول
        الجميع في المرحلة الثانية من انخفاض الحرارة (Hypothermia Stage 2)، مع تيبس أصابع كامل
        (motor_dexterity < 0.20)، تباطؤ كلامي، وهذيان للضعفاء كخليل وسلوم.
      physical_minimum: "Cognitive degradation and motor skill collapse mandatory."
    evidence:
      telemetry_timestamp: "04:30:00 (Minute 570 - Pre-Dawn Cold Peak)"
      telemetry:
        - "external_temp_at_0430: -8.0°C"
        - "car_03_temp_at_0430: -6.5°C"
        - "insulation_r_value: 0.0"
        - "heating_fuel_burned: 0"
    affected:
      components:
        - "characters.*.physical.core_temp_c"
        - "characters.*.physical.motor_dexterity"
        - "dialogue_pace_and_lucidity"
    simulation_impact:
      runs_affected: "84 / 100"
      fragility_score: 0.80
    remediation_proposal:
      proposal_id: "PR-003-COLD-DECAY"
      patch: >
        تجسيد ساعات الانتظار المتجمدة حسياً: تجمد البول في زوايا العربة، صراع النوم القاتل،
        وثقل الألسن في نطق الكلمات قبيل موال عزيز وبعده.

  - id: "WORLD-BUG-004"
    title: "اختراق حدود العزل السمعي بين العربة الأولى والعربة الثالثة"
    type: "Acoustic_and_Epistemic"
    severity: "MEDIUM"
    law_broken: "LAW-ACOUST-03 (Inter-Car Acoustic Isolation)"
    observed:
      description: >
        سماع الحراس في العربة الأولى لهمسات وحركات خافتة تجري في العربة الأخيرة ومقصورة العزل،
        والاستجابة لها كما لو كانوا في غرفة واحدة.
      state_snapshot: "acoustics.inter_car_isolation = breached"
    required:
      invariant: >
        مع وجود بابين منزلقين ورياح شمالية غربية عاتية (38 كم/س)، يبلغ الفقد السمعي بين العربة الأولى
        والثالثة > 35 dB؛ يستحيل سماع أي صوت دون 75 dB (لا يعبر سوى الرصاص والصراخ والطرق المعدني).
      physical_minimum: "Acoustic attenuation prevents transmission of normal speech."
    evidence:
      telemetry_timestamp: "20:30:00 (Minute 90 - Inter-Car Monitoring)"
      telemetry:
        - "wind_speed: 38 km/h"
        - "inter_car_doors: 2"
        - "ambient_noise_draft_db: 65 dB"
    affected:
      components:
        - "characters.خالد.epistemic_bubble"
        - "characters.حناطة.epistemic_bubble"
    simulation_impact:
      runs_affected: "76 / 100"
      fragility_score: 0.72
    remediation_proposal:
      proposal_id: "PR-004-ACOUSTICS"
      patch: >
        حصر معرفة خالد بما يجري في الخلف على الإشارات الحتمية: الطرق المتعمد على الصاج،
        أو نقل الخبر عبر أبي علي الذي يتحرك في الممر بين العربات.

  - id: "WORLD-BUG-005"
    title: "إصلاح أنبوب الوقود وشد السلك بالأصابع في الصقيع دون احتساب تآكل المهارات الدقيقة"
    type: "Biomechanics"
    severity: "MEDIUM_HIGH"
    law_broken: "LAW-BIO-01 & LAW-PNEUM-02"
    observed:
      description: >
        نزول سردار وأبي علي تحت الشاسيه وربط سلك معدني صلب (2 ملم) حول شق الأنبوب بسرعة وسلاسة،
        رغم أن حرارة الحديد تبلغ -7°C وملامسته تؤدي لالتصاق الجلد والتيبس الحركي.
      state_snapshot: "characters.سردار.physical.motor_dexterity assumed = 0.90 in extreme frost"
    required:
      invariant: >
        بعد ساعات الصقيع، لا يمكن ثني سلك صلب 2 ملم بالأصابع المجردة؛ يتطلب الإصلاح بالضرورة
        استخدام مفتاح الربط والزرادية (Pliers) لتدوير السلك، ومساندة جسدية ثنائية متناوبة.
      physical_minimum: "Mechanical tools and physical assistance required for 2mm wire twisting."
    evidence:
      telemetry_timestamp: "05:00:00 (Minute 600 - Undercarriage Repair)"
      telemetry:
        - "surface_temp_chassis: -7.2°C"
        - "unprotected_finger_skin_contact_limit: 15 seconds"
        - "wire_stiffness_yield: 250 MPa"
    affected:
      components:
        - "characters.سردار.physical"
        - "characters.أبو_علي.physical"
        - "repair_duration (must be >= 17 minutes)"
    simulation_impact:
      runs_affected: "87 / 100"
      fragility_score: 0.85
    remediation_proposal:
      proposal_id: "PR-005-REPAIR-PHYSICS"
      patch: >
        إبراز صراع الأدوات تحت الشاسيه: استخدام زرادية أبي علي لشد السلك، لفه على عتلة المفتاح
        الإنجليزي للتدوير بعزم ميكانيكي، واحتراق جلد أصابع سردار بالصقيع أثناء التثبيت.

  - id: "WORLD-BUG-006"
    title: "اجتياز مهدي لقوس نيران الكمين واختفاؤه دون بصمة تتبع فيزيائية"
    type: "Causality_and_Continuity"
    severity: "HIGH"
    law_broken: "LAW-SPATIAL-02 (Mass and Spatial Trajectory Conservation)"
    observed:
      description: >
        وثّق النص خروج مهدي بالقفز من الباب الجانبي المنزلق للعربة الوسطى بعد أن سحبه حناطة
        (الجزء الثالث، الفصل 4، سطر 717)، لكن الخرق الفيزيائي الحتمي يكمن في كيفية نجاته
        من القفز بمحاذاة السكة واجتيازه قوس نيران الكمين المنهمر على الجانبين واختفائه التام
        في العراء دون أن يصاب برصاصة ودون أن يترك أي بصمة دم أو أثر حركي على الحصى.
      state_snapshot: "characters.مهدي.location = unknown_void (post_escape)"
    required:
      invariant: >
        حركة أي كتلة حيوية بشرية (>60 كغم) تقفز إلى فضاء اشتباك مكشوف محاط بقوس نيران رشاشة
        تخضع لحتمية الاحتمال البالستي وترك آثار مادية ملموسة (انزلاق حصى، قطرات دم، أو تمزق قماش).
      physical_minimum: "Ballistic survival probability and physical ground trace required."
    evidence:
      telemetry_timestamp: "00:15:00 (Minute 315 - Breach Confusion)"
      text_attested_evidence:
        - "exit_aperture: middle_car_sliding_side_door (source: Part 3, Ch 4, Lines 701-717: Hannata unlatched sliding door, Mahdi jumped out into darkness)"
        - "ambush_firing_arc: covering both flanks (source: Part 3, Ch 1, Line 611 & Ch 4, Line 713)"
      simulation_assumptions:
        - "ballast_surface_trace: zero footprints or blood detected (class: assumption; physical anomaly in open gravel)"
        - "ballistic_crossfire_exposure_seconds: 4.5 (class: assumption; exposure time between door threshold and dead zone)"
    affected:
      components:
        - "characters.مهدي"
        - "ballistic_credibility"
        - "narrative_pacing_part_3"
    simulation_impact:
      runs_affected: "95 / 100"
      fragility_score: 0.90
    remediation_proposal:
      proposal_id: "PR-006-MEHDI-EXIT"
      patch: >
        تأسيس الغطاء البيئي والبالستي للقفزة: استغلال كثافة دخان احتراق شحم المحور المتجه
        مع الريح (سمت 135°)، واستتار مهدي بالزاوية الميتة لكتلة عجلات البوجي (Bogie) الضخمة
        أثناء تدحرجه في منخفض الحصى المحاذي للسكة قبل الانسلال في سواد وادي الظل.

  - id: "WORLD-BUG-007"
    title: "انزلاق التعداد البشري السردي قبل الكمين (عشرة رجال مقابل 14 راكباً)"
    type: "Continuity_and_Headcount"
    severity: "MEDIUM"
    law_broken: "LAW-DEMO-01 (Demographic Mosaic and Headcount Conservation)"
    observed:
      description: >
        يصف النص في الجزء الثاني، الفصل 6، السطر 577 «صوت تنفس متقطع لعشرة رجال محبوسين في بطن الحديد»
        في تمام الساعة 23:50 قبيل بدء الكمين، في حين أن التعداد الحقيقي لركاب القطار في هذه اللحظة
        هو 14 رجلاً حياً. الرقم 10 لا يصح فيزيائياً إلا بعد انتهاء الكمين وسقوط الشهداء الأربعة
        (14 - مقتل عباس وسلوم وحسن كاز - هروب مهدي = 10 رجال متبقين)، وهو ما يؤكده النص لاحقاً بدقة
        في الجزء الرابع، الفصل 3، السطر 1141 («أنفاس الرجال العشرة المتبقين»).
      state_snapshot: "characters.alive_count_at_2350 = 14, but text_described = 10"
    required:
      invariant: >
        حفظ الكتلة البشرية والتعداد السكاني يوجب التطابق الحتمي بين التعداد المنطوق أو الموصوف
        وبين الواقع الفيزيائي للأجساد الحية الموجودة على متن العربات في تلك اللحظة الزمنية.
      physical_minimum: "Headcount census must equal 14 living souls prior to minute 300 (00:00)."
    evidence:
      telemetry_timestamp: "23:50:00 (Minute 290 - Pre-Ambush Silence)"
      text_attested_evidence:
        - "pre_ambush_described_men: 10 (source: Part 2, Ch 6, Line 577: «صوت تنفس متقطع لعشرة رجال»)"
        - "actual_living_souls_at_2350: 14 (source: Part 1, Ch 1..8: 5 guards + 1 technician + 1 platform guard + 7 detainees)"
        - "post_ambush_actual_souls: 10 (source: Part 4, Ch 3, Line 1141: «أنفاس الرجال العشرة المتبقين»)"
      simulation_assumptions:
        - "authorial_anticipation_error: true (class: assumption; author inadvertently applied post-ambush headcount to pre-ambush scene)"
    affected:
      components:
        - "narrative_headcount_integrity"
        - "demographic_census"
    simulation_impact:
      runs_affected: "100 / 100"
      fragility_score: 0.75
    remediation_proposal:
      proposal_id: "PR-007-HEADCOUNT"
      patch: >
        توثيق الزلة السردية، وفي أي معالجة تحريرية مستقبلية يُعدل الوصف في سطر 577 ليصبح:
        «صوت تنفس متقطع لأربعة عشر رجلاً محبوسين في بطن الحديد» أو صياغة جمعية دون تحديد رقمي مسبق.

  - id: "WORLD-BUG-008"
    title: "المفارقة الزمنية لتقدير الفجر (ساعتان حوارياً مقابل شروق فلكي 06:48)"
    type: "Chrono_and_Perception"
    severity: "MEDIUM"
    law_broken: "LAW-CHRONO-01 (Solar and Astronomical Chronology)"
    observed:
      description: >
        يصرح خالد في الجزء الرابع، الفصل 3، السطر 1253 (عند قرابة الساعة 01:00 بعد انتهاء الكمين
        وتضميد الجراح): «بقى ساعتين ويطلع الضو. لازم نقرر شنسوي بالحديد قبل لا تطلع الشمس وتكشفنا للكاع كلها»،
        مما يفترض بزوغ الضوء عند ~03:00 وشروق الشمس عند ~03:30، بينما الحسابات الفلكية الصارمة لبادية
        الحماد في 18 كانون الثاني/يناير تحدد الفجر الفلكي عند 05:25 والشروق عند 06:48 (فارق زمني 3.8 ساعات).
      state_snapshot: "dialogue_implied_sunrise ~ 03:30 vs astronomical_sunrise = 06:48"
    required:
      invariant: >
        اتساق الكرونوتوب والزمن الفيزيائي مع الحوار المنطوق، أو التوثيق الصريح للانضغاط الزمني
        كعرض نفسي لصدمة القتال والصقيع الشديد، وتجنب أي تصحيح صامت في الجداول الحسابية.
      physical_minimum: "Solar ephemeris alignment or explicit psychological temporal compression required."
    evidence:
      telemetry_timestamp: "01:00:00 (Minute 360 - Post-Ambush Regroup)"
      text_attested_evidence:
        - "khalid_perceived_time_to_light: 2.0 hours (source: Part 4, Ch 3, Line 1253: «بقى ساعتين ويطلع الضو»)"
        - "current_scene_chrono_anchor: ~01:00 (source: Part 3, Ch 8, Line 943 to Part 4, Ch 1..3)"
      simulation_assumptions:
        - "astronomical_sunrise_hamad_jan18: 06:48:00 (class: assumption; based on standard solar ephemeris for lat 33.5°N)"
        - "discrepancy_magnitude: +3.8 hours (class: assumption; difference between dialogue estimate and solar dawn)"
    affected:
      components:
        - "characters.خالد.perception"
        - "timeline_continuity"
        - "chrono_spatial_system"
    simulation_impact:
      runs_affected: "100 / 100"
      fragility_score: 0.70
    remediation_proposal:
      proposal_id: "PR-008-CHRONO-DISTORTION"
      patch: >
        توثيق مقولة خالد إما كـ "تشوه إدراكي ذاتي للزمن تحت وطأة الصقيع والصدمة" (Subjective Temporal
        Compression)، أو كـ "زلة تسريع زمني للمؤلف" للربط بمشهد بزوغ رماد الفجر في الجزء الخامس فصل 1.

