    severity: "HIGH"
    law_broken: "LAW-TACTICAL-01 (Predator Advantage Conservation)"
    observed:
      description: >
        توقف إطلاق النار فجأة عند الدقيقة 00:35 كما لو أن صماماً عملاقاً قد أُغلق،
        وانسحب المهاجمون تماماً تاركين قطاراً معطلاً في العراء لا يملك سوى بندقية واحدة.
      state_snapshot: "threats.ambushers.status = withdrawn_spontaneously"
    required:
      invariant: >
        طرف يملك التفوق التكتيكي المطلق (الذخيرة، العتمة، إحاطة الهدف، تجمد الخصم) لا ينسحب
        إلا لظهور كلفة سالبة قاهرة (Threat/Cost Trigger) تكسر ميزان القوى، أو لتحقق غايته بدقة.
      physical_minimum: "External constraint or specific objective fulfillment required."
    evidence:
      telemetry_timestamp: "00:35:00 (Minute 335 - Ambush Cessation Point)"
      causal_consumption_trace:
        initial_rounds_at_1900: 118
        rounds_expended_in_ambush_0000_to_0035: 73
        rounds_expended_breakdown:
          abbas_weapon_rounds_fired: 3  # text-attested (Part 3, Ch 2, Lines 625 & 639)
          khalid_weapon_rounds_fired: 28  # class: assumption (estimated defense expenditure)
          wooden_crate_rounds_fired_by_sardar_and_guards: 42  # class: assumption (estimated defensive fire)
        train_effective_rounds_remaining: 45  # class: assumption
      text_attested_evidence:
        - "abbas_weapon_rounds_fired: 3 (source: Part 3, Ch 2, Lines 625 & 639; 2 shots from platform + 1 under wheel, weapon jammed on 4th)"
        - "train_mobility: 0 (source: Part 1, Ch 6, Lines 179-228; locked by Westinghouse fail-safe shoes)"
      simulation_assumptions:
        - "ambushers_estimated_rounds: > 300 (class: assumption; inferred from intense flanking crossfire)"
        - "ambient_temp: -4.0°C (class: assumption; derived from Jan 18 astronomical/meteorological model)"
        - "train_effective_rounds_remaining: 45 (class: assumption; remaining defense reserve)"
    affected:
