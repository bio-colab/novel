bugs:
  - id: "WORLD-BUG-001"
    title: "مقصورة القيادة مقفلة بسقاطة داخلية دون وجود فاعل فيزيائي"
    type: "Causality"
    severity: "CRITICAL"
    law_broken: "LAW-SPATIAL-01 (Conservation of Mechanical Closure)"
    observed:
      description: >
        طرق أبو علي وخالد باب مقصورة السائق ووجداه مغلقاً بسقاطة فولاذية داخلية جاذبية.
        في نهاية الرواية تُركت المقصورة مغلقة وتم تشغيل القاطرة يدوياً من الخارج دون فتحها.
      state_snapshot: "train.locomotive.cabin.internal_latch_engaged = true"
    required:
      invariant: >
        سقاطة الإغلاق الميكانيكية الداخلية تتطلب إما وجود كائن داخل المقصورة قام بإسقاطها،
        أو آلية ارتداد هيدروليكية صدمية موثقة أغلقتها، أو أن السائق هرب وترك منفذاً بديلاً مفتوحاً.
      physical_minimum: "Causal agent or mechanical mechanism required to engage internal gravity latch."
    evidence:
      telemetry_timestamp: "05:45:00 (Minute 645 - Engine Restart Attempt)"
      telemetry:
        - "door_state: latched_internally"
        - "cabin_glass: intact"
        - "driver_status: missing_or_dead"
        - "front_breach_detected: false"
    affected:
      components:
        - "train.locomotive.cabin"
        - "timeline (05:45 engine restart sequence)"
        - "causal logic of driver escape/fate"
    simulation_impact:
      runs_affected: "100 / 100"
      fragility_score: 0.95
    remediation_proposal:
      proposal_id: "PR-001-CABIN"
      patch: >
        إضافة أثر مادي حتمي يكتشفه أبو علي عند الفجر: شرخ في الزجاج السفلي لنافذة السائق المطلة
        على السكة مع سقوط حذاء السائق في مجرى الرمل، أو سماع ارتطام جثة السائق المتصلبة بالصاج
        عند أول دوران للمكبس.

  - id: "WORLD-BUG-002"
    title: "انسحاب المهاجمين المفاجئ في عتمة منتصف الليل دون مبرر تكتيكي أو كلفة سالبة"
